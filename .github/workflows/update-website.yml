name: Update Website Version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Get the new version tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Checkout Website Repository
        uses: actions/checkout@v4
        with:
          repository: 'zenc-lang-ce/zenc-lang-ce.github.io'
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: 'website-repo'

      - name: Update the version in the site configuration
        # Every page of the site reads it from config.extra.version.
        run: |
          cd website-repo
          sed -i -E 's/version = "v[0-9]+\.[0-9]+\.[0-9]+"/version = "'"${{ env.VERSION }}"'"/g' docs.zenc-lang.org/config.toml

      - name: Commit and Push to Website Repo
        run: |
          cd website-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs.zenc-lang.org/config.toml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump website version to ${{ env.VERSION }}" && git push)
